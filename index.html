<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA UT - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <!-- Kontainer Login Utama -->
    <div class="login-container">
        <h2>Selamat Datang</h2>
        <form id="formLogin">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">Masuk</button>
        </form>
        
        <div class="login-links">
            <button id="btnLupaPassword" class="btn-link">Lupa password?</button>
            <button id="btnDaftar" class="btn-link">Belum punya akun? Daftar</button>
        </div>
    </div>

    <!-- Modal Box: Lupa Password -->
    <div id="modalLupaPassword" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeLupaPassword">&times;</span>
            <h3>Lupa Password</h3>
            <p>Masukkan email Anda untuk mereset password.</p>
            <input type="email" placeholder="Email Anda" class="modal-input">
            <button class="btn-primary">Kirim Link Reset</button>
        </div>
    </div>

    <!-- Modal Box: Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeDaftar">&times;</span>
            <h3>Daftar Akun Baru</h3>
            <p>Silakan isi data diri Anda.</p>
            <input type="text" placeholder="Nama Lengkap" class="modal-input">
            <input type="email" placeholder="Email" class="modal-input">
            <input type="password" placeholder="Password Baru" class="modal-input">
            <button class="btn-primary">Daftar Sekarang</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
